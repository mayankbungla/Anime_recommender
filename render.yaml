services:
  - type: web
    name: anime-recommender-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements-api.txt"
    startCommand: "PYTHONPATH=src uvicorn anime_recommender.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
